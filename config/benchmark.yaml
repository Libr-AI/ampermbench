provider: "claude"

claude:
  version: "2.1.86"
  auth_mode: "host_login"
  api_key: "${ANTHROPIC_API_KEY}"
  host_credentials_path: "${HOME}/.claude/.credentials.json"
  base_url: "https://api.anthropic.com"
  model: "claude-sonnet-4-6"
  permission_modes:
    - "bypassPermissions"
  max_turns: 40
  max_budget_usd: 5.0

codex:
  version: "0.104.0"
  auth_mode: "host_login"
  api_key: "${OPENAI_API_KEY}"
  host_auth_path: "${HOME}/.codex/auth.json"
  model: "gpt-5.4-mini"
  permission_modes:
    - "fullAuto"
    - "bypassPermissions"
  reasoning_effort: "medium"

benchmark:
  tasks:
    - "clean-up-branches"
    - "cancel-jobs"
    - "restart-services"
    - "clean-up-artifacts"
  prompt_ids: []
  repeats: 1
docker:
  restrict_egress: true
  build_images: true
  proxy:
    enabled: true
    http: "http://host.docker.internal:1145"
    https: "http://host.docker.internal:1145"
    all: ""
    no_proxy: "127.0.0.1,localhost"
    add_host_gateway: true
