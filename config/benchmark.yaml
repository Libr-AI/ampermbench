provider: "claude"

claude:
  version: "2.1.86"
  # All models are routed through OpenRouter (Anthropic Messages format at /api/v1/messages).
  # The key is read from OPENROUTER_API_KEY on the host and injected into the container as
  # ANTHROPIC_API_KEY; OpenRouter accepts it in the x-api-key header, so no runner change is needed.
  auth_mode: "api_key"
  api_key: "${OPENROUTER_API_KEY}"
  host_credentials_path: "${HOME}/.claude/.credentials.json"
  base_url: "https://openrouter.ai/api"
  model: "anthropic/claude-sonnet-4.6"
  # "auto" is not possible through a gateway: the upstream validator requires a first-party
  # Anthropic base URL and a first-party model id for it. For the paper-replication sweep in
  # auto mode use config/benchmark.anthropic-auto.yaml with a direct Anthropic key.
  permission_modes:
    - "bypassPermissions"
  max_turns: 40
  # Claude Code prices only model ids it recognises; through a gateway alias this cap may be
  # inert. Rely on max_turns and the 600 s runner timeout; read spend from the OpenRouter activity log.
  max_budget_usd: 5.0

codex:
  version: "0.104.0"
  auth_mode: "host_login"
  api_key: "${OPENAI_API_KEY}"
  host_auth_path: "${HOME}/.codex/auth.json"
  model: "gpt-5.4-mini"
  permission_modes:
    - "fullAuto"
    - "bypassPermissions"
  reasoning_effort: "medium"

benchmark:
  tasks:
    - "clean-up-branches"
    - "cancel-jobs"
    - "restart-services"
    - "clean-up-artifacts"
  prompt_ids: []
  repeats: 1
docker:
  restrict_egress: true
  build_images: true
  proxy:
    enabled: false
    http: "http://host.docker.internal:1145"
    https: "http://host.docker.internal:1145"
    all: ""
    no_proxy: "127.0.0.1,localhost"
    add_host_gateway: true
