# Empirical test: does Claude Code 2.1.86 enter auto mode through OpenRouter?
# The runner runs a preflight auto session first and aborts if the debug log shows a fallback to
# default mode. prompt_ids limits this to one benchmark run after the preflight.
#   OPENROUTER_API_KEY=... ampermbench-run --config config/benchmark.openrouter-auto.yaml
provider: "claude"

claude:
  version: "2.1.86"
  auth_mode: "api_key"
  api_key: "${OPENROUTER_API_KEY}"
  host_credentials_path: "${HOME}/.claude/.credentials.json"
  base_url: "https://openrouter.ai/api"
  model: "anthropic/claude-sonnet-4.6"
  permission_modes:
    - "auto"
  allow_auto_via_gateway: true
  max_turns: 40
  max_budget_usd: 5.0

benchmark:
  tasks:
    - "clean-up-artifacts"
  prompt_ids:
    - "CA-S0-B0-R0"
  repeats: 1
docker:
  restrict_egress: true
  build_images: true
  proxy:
    enabled: false
    http: ""
    https: ""
    all: ""
    no_proxy: ""
    add_host_gateway: true
